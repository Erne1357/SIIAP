# docker/docker-compose.prod.yml
#
# Blue-green production stack. Driven by docker/scripts/deploy.sh — do not run
# `docker compose up -d` by hand without `--profile <color>`: the two web
# colors only exist under their profile, so a bare `up` starts infra, celery
# and nginx and NO web at all.
#
#   web-blue / web-green  same image, one live at a time. nginx points at the
#                         live one through .deploy/nginx/upstream.conf, which
#                         the deploy rewrites and then `nginx -s reload`s.
#                         nginx never needs a restart: the reload re-resolves
#                         the container name, which is what the old single
#                         `web` service never got (stale IP → 502 until
#                         someone restarted nginx by hand).
#   celery-*              recreated with the new image right after the switch.
#   db / redis            never recreated by a deploy (`--no-recreate`).
#
# IMAGE_TAG is the git short SHA of the release. The image is built once
# (`build` lives only on web-blue/web-green) and every app service reuses it.
name: SIIAP

x-app: &app
  image: siiap-app:${IMAGE_TAG:-latest}
  pull_policy: never
  restart: always
  env_file:
    - .env.prod
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-env: &app-env
  TZ: America/Ciudad_Juarez
  # Every static URL carries ?v=<release>; nginx caches /static/ for a year.
  STATIC_VERSION: ${IMAGE_TAG:-latest}
  # Migrations run once per deploy in a throwaway container of the NEW image
  # (deploy.sh), before any traffic moves. No long-running service migrates.
  SKIP_MIGRATIONS: "true"

x-web: &web
  <<: *app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  expose:
    - "5000"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ../instance:/app/instance
    # database/ is copied to the server by hand and never enters the image
    # (.dockerignore). Mounted read-only for `flask seed-permissions` and
    # `flask apply-patches`, which read their SQL from here.
    - ../database:/app/database:ro
  # eventlet requiere exactamente 1 worker por proceso; el paralelismo viene
  # de la concurrencia async de eventlet. Socket.IO entre colores y celery va
  # por Redis (message_queue), así que dos colores vivos a la vez no pierden
  # emisiones durante el cambio.
  command: >
    sh -c "exec gunicorn
    --bind 0.0.0.0:5000
    --worker-class eventlet
    --workers 1
    --timeout ${GUNICORN_TIMEOUT:-120}
    --graceful-timeout 25
    --access-logfile -
    --error-logfile -
    app:app"
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:5000/ready || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 6
    start_period: 30s

services:
  # ─── Base de datos ────────────────────────────────────────────────────────
  db:
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    env_file:
      - .env.prod
    environment:
      - TZ=America/Ciudad_Juarez
    volumes:
      # SIN /data, y el nombre del volumen cambia. Las dos cosas son por la
      # imagen 18: a partir de esa version la oficial guarda los datos en un
      # subdirectorio por version mayor (/var/lib/postgresql/18/docker) para
      # permitir `pg_upgrade --link` sin cruzar puntos de montaje, y el montaje
      # va un nivel arriba. Con el montaje de siempre, PG18 se NIEGA a arrancar
      # con un error largo sobre pg_ctlcluster. Comprobado en dev-real el
      # 2026-08-13: paso tal cual.
      #
      # El volumen es NUEVO porque el directorio de datos de un cluster 16 no lo
      # lee un 18: la via es dump + volumen nuevo + restore. `pgdata` se
      # conserva declarado abajo justamente para poder volver.
      #
      # Esto va COMETIDO y no editado en el servidor a proposito: el deploy hace
      # `git reset --hard <sha>`, asi que una edicion a mano aqui
      # desapareceria en el siguiente despliegue y la base dejaria de arrancar
      # semanas despues, sin que nadie recuerde por que.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache / Broker (Redis) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    environment:
      - TZ=America/Ciudad_Juarez
    # Sin exposición de puerto en producción — solo accesible dentro de la red Docker
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Aplicación web: dos colores, uno vivo ───────────────────────────────
  web-blue:
    <<: *web
    profiles: ["blue"]
    environment:
      <<: *app-env
      INSTANCE_COLOR: blue

  web-green:
    <<: *web
    profiles: ["green"]
    environment:
      <<: *app-env
      INSTANCE_COLOR: green

  # ─── Celery worker (tareas asíncronas) ────────────────────────────────────
  celery-worker:
    <<: *app
    command: >
      celery -A app.celery_worker.celery worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    # Warm shutdown: lets a running task (a bulk e-mail batch) finish before
    # the container is replaced by the next release.
    stop_grace_period: 60s
    volumes:
      - ../instance:/app/instance

  # ─── Celery Beat (tareas periódicas) ──────────────────────────────────────
  celery-beat:
    <<: *app
    command: >
      celery -A app.celery_worker.celery beat
      --loglevel=info
      --schedule=/app/instance/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - ../instance:/app/instance

  # ─── Reverse proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.28-alpine
    restart: always
    environment:
      - TZ=America/Ciudad_Juarez
    # Config is read from mounted DIRECTORIES, never from a single-file bind
    # mount: `git reset --hard` replaces files (new inode), and a single-file
    # mount keeps showing the old inode, so `nginx -s reload` would silently
    # re-read the stale config.
    command: ["nginx", "-c", "/etc/nginx/siiap/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx:/etc/nginx/siiap:ro
      # Written by deploy.sh: upstream.conf (live color + static release).
      - ../.deploy/nginx:/etc/nginx/siiap-runtime:ro
      # One directory per release, extracted from that release's image, so the
      # CSS/JS nginx serves always matches the color it routes to.
      - ../.deploy/static:/srv/static:ro
    ports:
      - "127.0.0.1:8081:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # El volumen del cluster 16. NO lo borres: es la vuelta atras del salto a 18.
  # Mientras exista, revertir es cambiar el montaje de arriba y el FROM de
  # docker/Dockerfile.db.
  pgdata:
  pgdata18:
  redisdata:
