# docker/docker-compose.prod.yml
name: SIIAP

services:
  # ─── Base de datos ────────────────────────────────────────────────────────
  db:
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    env_file:
      - .env.prod
    environment:
      - TZ=America/Ciudad_Juarez
    volumes:
      # SIN /data, y el nombre del volumen cambia. Las dos cosas son por la
      # imagen 18: a partir de esa version la oficial guarda los datos en un
      # subdirectorio por version mayor (/var/lib/postgresql/18/docker) para
      # permitir `pg_upgrade --link` sin cruzar puntos de montaje, y el montaje
      # va un nivel arriba. Con el montaje de siempre, PG18 se NIEGA a arrancar
      # con un error largo sobre pg_ctlcluster. Comprobado en dev-real el
      # 2026-08-13: paso tal cual.
      #
      # El volumen es NUEVO porque el directorio de datos de un cluster 16 no lo
      # lee un 18: la via es dump + volumen nuevo + restore. `pgdata` se
      # conserva declarado abajo justamente para poder volver.
      #
      # Esto va COMETIDO y no editado en el servidor a proposito: el deploy hace
      # `git reset --hard origin/main`, asi que una edicion a mano aqui
      # desapareceria en el siguiente despliegue y la base dejaria de arrancar
      # semanas despues, sin que nadie recuerde por que.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache / Broker (Redis) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    environment:
      - TZ=America/Ciudad_Juarez
    # Sin exposición de puerto en producción — solo accesible dentro de la red Docker
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Aplicación web ───────────────────────────────────────────────────────
  web:
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - TZ=America/Ciudad_Juarez
    volumes:
      - /home/cuaderno/SIIAP/instance:/app/instance
    # eventlet requiere exactamente 1 worker por proceso;
    # el paralelismo real viene de la concurrencia async de eventlet.
    # Para múltiples réplicas usa Docker Swarm/Kubernetes con Redis como message_queue.
    command: >
      sh -c "gunicorn
      --bind 0.0.0.0:5000
      --worker-class eventlet
      --workers 1
      --timeout ${GUNICORN_TIMEOUT:-120}
      --access-logfile -
      --error-logfile -
      app:app"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  # ─── Celery worker (tareas asíncronas) ────────────────────────────────────
  celery-worker:
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      celery -A app.celery_worker.celery worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - TZ=America/Ciudad_Juarez
      # docker/entrypoint.sh corre `flask db upgrade` al arrancar salvo que esto
      # sea true, y lo dice su propio comentario: "Solo el contenedor 'web' debe
      # correr migraciones. Los workers de Celery deben arrancar con
      # SKIP_MIGRATIONS=true para evitar el race condition que causa
      # UniqueViolation en alembic_version."
      #
      # No estaba puesto en ningun servicio, asi que web, celery-worker y
      # celery-beat arrancaban los tres a la vez corriendo la misma migracion.
      # Con DDL transaccional de Postgres el perdedor revierte limpio, asi que no
      # corrompe nada, pero llena el log de errores justo durante un despliegue y
      # enseña a ignorar la salida. Sobre una migracion con relleno fila a fila
      # —las de uuid— es ademas la peor hora para tener dos escritores.
      - SKIP_MIGRATIONS=true
    volumes:
      - /home/cuaderno/SIIAP/instance:/app/instance

  # ─── Celery Beat (tareas periódicas) ──────────────────────────────────────
  celery-beat:
    restart: always
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: >
      celery -A app.celery_worker.celery beat
      --loglevel=info
      --schedule=/app/instance/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - TZ=America/Ciudad_Juarez
      # Mismo motivo que en celery-worker: solo `web` migra.
      - SKIP_MIGRATIONS=true
    volumes:
      - /home/cuaderno/SIIAP/instance:/app/instance

  # ─── Reverse proxy ────────────────────────────────────────────────────────
  nginx:
    restart: always
    image: nginx:stable-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      - TZ=America/Ciudad_Juarez
    volumes:
      - /home/cuaderno/SIIAP/app/static:/usr/share/nginx/html/static:ro
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8081:80"

volumes:
  # El volumen del cluster 16. NO lo borres: es la vuelta atras del salto a 18.
  # Mientras exista, revertir es cambiar el montaje de arriba y el FROM de
  # docker/Dockerfile.db.
  pgdata:
  pgdata18:
  redisdata:
