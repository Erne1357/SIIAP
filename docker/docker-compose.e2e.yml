# docker/docker-compose.e2e.yml — browser end-to-end suite, identical in CI and locally.
#
#   docker compose -f docker/docker-compose.e2e.yml up --build \
#       --abort-on-container-exit --exit-code-from e2e
#   docker compose -f docker/docker-compose.e2e.yml down -v
#
# app  — the real stack (gunicorn + eventlet, PostgreSQL 18, Redis), configured
#        as production (FLASK_ENV=production), schema built from the models and
#        seeded with synthetic users by tests/e2e/seed.py. Nothing from database/.
# e2e  — Playwright (Chromium) running pytest -m e2e against http://app:5000.
name: siiap-e2e

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siiap_e2e
      TZ: America/Ciudad_Juarez
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siiap_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      TZ: America/Ciudad_Juarez
      FLASK_APP: app
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      APP_BASE_URL: http://app:5000
      SECRET_KEY: e2e-secret-key-not-for-production
      SESSION_COOKIE_SECURE: "False"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/siiap_e2e
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STATIC_VERSION: e2e
      UPLOAD_FOLDER: /tmp/siiap-e2e-uploads
      # eventlet's pure-Python resolver times out (10 s per lookup) against Docker
      # Desktop's embedded DNS, so `redis` / `db` never resolve inside the worker.
      # The system resolver is fine; harmless on Linux/CI.
      EVENTLET_NO_GREENDNS: "yes"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m tests.support.build_schema
      && python -m tests.e2e.seed
      && exec gunicorn --bind 0.0.0.0:5000 --worker-class eventlet --workers 1
      --timeout 60 --access-logfile - --error-logfile - app:app"
    ports:
      - "127.0.0.1:5055:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/ready || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  e2e:
    image: mcr.microsoft.com/playwright/python:v1.49.1-noble
    working_dir: /work
    volumes:
      - ..:/work
    environment:
      E2E_BASE_URL: http://app:5000
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    depends_on:
      app:
        condition: service_healthy
    # --confcutdir keeps the root tests/conftest.py (which imports the Flask
    # app) out of this container: the browser side only talks HTTP.
    command: >
      sh -c "pip install -q pytest==8.3.4 pytest-playwright==0.6.2 playwright==1.49.1 pytest-timeout==2.3.1
      && python -m pytest tests/e2e -m e2e -p no:cacheprovider
      --confcutdir=tests/e2e --base-url http://app:5000
      --output test-results/e2e --screenshot only-on-failure --tracing retain-on-failure"
