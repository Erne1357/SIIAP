[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    postgres: needs a real PostgreSQL in DATABASE_URL; skipped otherwise
    e2e: browser end-to-end test against a running app (E2E_BASE_URL)
    infra: static checks over deploy, CI, compose and nginx files
    style: static checks over templates, CSS and JS against the CLAUDE.md rules
norecursedirs = venv .git node_modules
timeout = 120
filterwarnings =
    ignore::DeprecationWarning
